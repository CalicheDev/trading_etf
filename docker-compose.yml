services:
  bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    volumes:
      - ./:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: python bot.py

  dashboard:
    build: .
    container_name: trading-dashboard
    restart: unless-stopped
    volumes:
      - ./:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    expose:
      - "8501"
    command: >
      streamlit run dashboard.py
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    depends_on:
      - bot

  caddy:
    image: caddy:2-alpine
    container_name: trading-caddy
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard

volumes:
  caddy_data:
  caddy_config:
