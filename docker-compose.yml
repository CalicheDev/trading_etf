services:
  bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    volumes:
      - ./:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: python bot.py

  dashboard:
    build: .
    container_name: trading-dashboard
    restart: unless-stopped
    volumes:
      - ./:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    expose:
      - "8501"
    networks:
      - default
      - tlbot_default
    command: >
      streamlit run dashboard.py
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    depends_on:
      - bot

networks:
  tlbot_default:
    external: true
